name: Inspect SFTP layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install SFTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Inspect remote directories
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
        run: |
          set -euo pipefail

          HOST="$(printf '%s' "${SFTP_HOST}" | tr -d '\r\n\t ')"
          HOST="${HOST#\"}"
          HOST="${HOST%\"}"
          HOST="${HOST#\'}"
          HOST="${HOST%\'}"
          HOST="${HOST#SFTP_HOST=}"
          HOST="${HOST#sftp://}"
          HOST="${HOST#ssh://}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          HOST="${HOST##*@}"
          HOST="${HOST%%\?*}"
          HOST="${HOST%%\#*}"

          PORT="${SFTP_PORT:-22}"
          if [[ "${HOST}" =~ ^(.+):([0-9]+)$ ]]; then
            HOST="${BASH_REMATCH[1]}"
            PORT="${BASH_REMATCH[2]}"
          fi

          export SSHPASS="${SFTP_PASSWORD}"
          sshpass -e sftp \
            -b - \
            -oBatchMode=no \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 \
            -P "${PORT}" \
            "${SFTP_USER}@${HOST}" <<'SFTP'
          pwd
          ls -la
          -cd ..
          pwd
          ls -la
          -cd ..
          pwd
          ls -la
          -cd ..
          pwd
          ls -la
          bye
          SFTP
