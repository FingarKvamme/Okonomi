name: Inspect Økonomi SFTP target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-okonomi-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Inspect target tree
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "${SFTP_HOST}" | tr -d '\r\n\t ')"
          HOST="${HOST#\"}"
          HOST="${HOST%\"}"
          HOST="${HOST#\'}"
          HOST="${HOST%\'}"
          HOST="${HOST#SFTP_HOST=}"
          HOST="${HOST#sftp://}"
          HOST="${HOST#ssh://}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          HOST="${HOST##*@}"
          HOST="${HOST%%\?*}"
          HOST="${HOST%%\#*}"
          PORT="${SFTP_PORT:-22}"
          if [[ "${HOST}" =~ ^(.+):([0-9]+)$ ]]; then
            HOST="${BASH_REMATCH[1]}"
            PORT="${BASH_REMATCH[2]}"
          fi

          lftp -u "${SFTP_USER},${SFTP_PASSWORD}" "sftp://${HOST}:${PORT}" <<'LFTP'
          set cmd:fail-exit no
          set sftp:auto-confirm yes
          pwd
          cls -la
          echo "--- webroots ---"
          cls -la webroots
          echo "--- webroots/r1394933 ---"
          cls -la webroots/r1394933
          echo "--- /webroots ---"
          cls -la /webroots
          echo "--- /webroots/r1394933 ---"
          cls -la /webroots/r1394933
          bye
          LFTP
