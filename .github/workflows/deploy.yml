name: Deploy Økonomi via SFTP

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-okonomi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy public directory
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SFTP_HOST"
          test -n "$SFTP_USER"
          test -n "$SFTP_PASSWORD"
          test -n "$SFTP_REMOTE_PATH"

          # SFTP-brukeren er chrootet. En verdi som "/Økonomi" må derfor
          # tolkes relativt til SFTP-roten, ikke som en absolutt serversti.
          REMOTE_PATH="${SFTP_REMOTE_PATH#/}"

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mkdir -p "$REMOTE_PATH"
          mirror -R \
            --verbose \
            --parallel=4 \
            --delete \
            ./public/ "$REMOTE_PATH"
          bye
          EOF

      - name: Verify public page
        shell: bash
        run: |
          status="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/okonomi.html --write-out "%{http_code}" \
            "https://fundamentaleiendom.no/%C3%98konomi/" || true)"
          echo "HTTP status: $status"
          test "$status" = "200"
          grep -q "<title>Økonomi</title>" /tmp/okonomi.html
