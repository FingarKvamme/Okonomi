name: Deploy Økonomi

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-okonomi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          : "${SFTP_USER:?Missing SFTP_USER}"
          : "${SFTP_HOST:?Missing SFTP_HOST}"
          : "${SFTP_PASSWORD:?Missing SFTP_PASSWORD}"
          : "${SFTP_REMOTE_PATH:?Missing SFTP_REMOTE_PATH}"

          if [[ "${SFTP_REMOTE_PATH}" == *"://"* ]]; then
            echo "SFTP_REMOTE_PATH must be an SFTP path, not a URL." >&2
            exit 1
          fi

      - name: Generate server configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER || vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          php -r '
            $config = [
              "google_client_id" => getenv("GOOGLE_CLIENT_ID") ?: "",
              "db_host" => getenv("DB_HOST") ?: "localhost",
              "db_port" => (int)(getenv("DB_PORT") ?: "3306"),
              "db_name" => "coiurr9fr_db1394934",
              "db_user" => getenv("DB_USER") ?: "coiurr9fr_db1394934",
              "db_password" => getenv("DB_PASSWORD") ?: "",
            ];
            file_put_contents(
              "public/config.generated.php",
              "<?php\ndeclare(strict_types=1);\nreturn " . var_export($config, true) . ";\n"
            );
          '

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install SFTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy public directory over SFTP
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail

          HOST="$(printf '%s' "${SFTP_HOST}" | tr -d '\r\n\t ')"
          HOST="${HOST#\"}"
          HOST="${HOST%\"}"
          HOST="${HOST#\'}"
          HOST="${HOST%\'}"
          HOST="${HOST#SFTP_HOST=}"
          HOST="${HOST#sftp://}"
          HOST="${HOST#ssh://}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          HOST="${HOST##*@}"
          HOST="${HOST%%\?*}"
          HOST="${HOST%%\#*}"

          PORT="${SFTP_PORT:-22}"
          if [[ "${HOST}" =~ ^(.+):([0-9]+)$ ]]; then
            HOST="${BASH_REMATCH[1]}"
            PORT="${BASH_REMATCH[2]}"
          fi

          TARGET="${SFTP_REMOTE_PATH#/}"
          TARGET="${TARGET%/}"

          lftp -u "${SFTP_USER},${SFTP_PASSWORD}" "sftp://${HOST}:${PORT}" <<LFTP
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --verbose --parallel=4 --delete ./public/ "${TARGET}"
          bye
          LFTP

      - name: Verify public page and Google config
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/okonomi.html --write-out "%{http_code}" \
            "https://fundamentaleiendom.no/%C3%98konomi/")"
          echo "HTTP status: ${STATUS}"
          test "${STATUS}" = "200"
          grep -q "<title>Økonomi</title>" /tmp/okonomi.html

          API_STATUS="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/okonomi-me.json --write-out "%{http_code}" \
            "https://fundamentaleiendom.no/%C3%98konomi/api.php?action=me")"
          echo "API status: ${API_STATUS}"
          test "${API_STATUS}" = "200"
          php -r '
            $d = json_decode(file_get_contents("/tmp/okonomi-me.json"), true);
            if (!is_array($d) || empty($d["googleClientId"])) {
              fwrite(STDERR, "Live GOOGLE_CLIENT_ID is missing.\n");
              exit(1);
            }
          '

# Redeploy after GOOGLE_CLIENT_ID update
