name: Deploy Økonomi

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-okonomi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          : "${SFTP_USER:?Missing SFTP_USER}"
          : "${SFTP_HOST:?Missing SFTP_HOST}"
          : "${SFTP_PASSWORD:?Missing SFTP_PASSWORD}"
          : "${SFTP_REMOTE_PATH:?Missing SFTP_REMOTE_PATH}"

      - name: Generate server configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER || vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          php -r '
            $config = [
              "google_client_id" => getenv("GOOGLE_CLIENT_ID") ?: "",
              "db_host" => getenv("DB_HOST") ?: "localhost",
              "db_port" => (int)(getenv("DB_PORT") ?: "3306"),
              "db_name" => "coiurr9fr_db1394934",
              "db_user" => getenv("DB_USER") ?: "coiurr9fr_db1394934",
              "db_password" => getenv("DB_PASSWORD") ?: "",
            ];
            file_put_contents(
              "public/config.generated.php",
              "<?php\ndeclare(strict_types=1);\nreturn " . var_export($config, true) . ";\n"
            );
          '

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy public directory over SFTP
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
        run: |
          set -euo pipefail

          REMOTE_DIR="${SFTP_REMOTE_PATH#/}"
          REMOTE_DIR="${REMOTE_DIR%/}"
          : "${REMOTE_DIR:?SFTP_REMOTE_PATH resolves to an empty path}"

          HOST="${SFTP_HOST#sftp://}"
          HOST="${HOST#ssh://}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"

          PORT="${SFTP_PORT:-22}"
          if [[ "${HOST}" =~ ^(.+):([0-9]+)$ ]]; then
            HOST="${BASH_REMATCH[1]}"
            PORT="${BASH_REMATCH[2]}"
          fi
          : "${HOST:?SFTP_HOST resolves to an empty host}"

          export SSHPASS="${SFTP_PASSWORD}"
          sshpass -e sftp \
            -oBatchMode=no \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 \
            -P "${PORT}" \
            "${SFTP_USER}@${HOST}" <<SFTP
          -mkdir "${REMOTE_DIR}"
          cd "${REMOTE_DIR}"
          lcd public
          put -r *
          put .htaccess
          bye
          SFTP
