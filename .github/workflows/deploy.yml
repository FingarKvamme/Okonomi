name: Deploy Økonomi

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-okonomi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          : "${SFTP_USER:?Missing SFTP_USER}"
          : "${SFTP_HOST:?Missing SFTP_HOST}"
          : "${SFTP_PASSWORD:?Missing SFTP_PASSWORD}"
          : "${SFTP_REMOTE_PATH:?Missing SFTP_REMOTE_PATH}"

      - name: Generate server configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
          DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER || vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          php -r '
            $config = [
              "google_client_id" => getenv("GOOGLE_CLIENT_ID") ?: "",
              "db_host" => getenv("DB_HOST") ?: "localhost",
              "db_port" => (int)(getenv("DB_PORT") ?: "3306"),
              "db_name" => "coiurr9fr_db1394934",
              "db_user" => getenv("DB_USER") ?: "coiurr9fr_db1394934",
              "db_password" => getenv("DB_PASSWORD") ?: "",
            ];
            file_put_contents(
              "public/config.generated.php",
              "<?php\ndeclare(strict_types=1);\nreturn " . var_export($config, true) . ";\n"
            );
          '

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy public directory over SFTP
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || vars.SFTP_PORT }}
        run: |
          set -euo pipefail

          WEB_PATH="${SFTP_REMOTE_PATH}"
          if [[ "${WEB_PATH}" == http://* || "${WEB_PATH}" == https://* ]]; then
            WEB_PATH="${WEB_PATH#*://}"
            WEB_PATH="${WEB_PATH#*/}"
          fi
          WEB_PATH="${WEB_PATH#/}"
          WEB_PATH="${WEB_PATH%/}"
          : "${WEB_PATH:?SFTP_REMOTE_PATH does not contain a target folder}"

          HOST="$(printf '%s' "${SFTP_HOST}" | tr -d '\r\n\t ')"
          HOST="${HOST#\"}"
          HOST="${HOST%\"}"
          HOST="${HOST#\'}"
          HOST="${HOST%\'}"
          HOST="${HOST#SFTP_HOST=}"
          HOST="${HOST#sftp://}"
          HOST="${HOST#ssh://}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          HOST="${HOST##*@}"
          HOST="${HOST%%\?*}"
          HOST="${HOST%%\#*}"

          PORT="${SFTP_PORT:-22}"
          if [[ "${HOST}" =~ ^(.+):([0-9]+)$ ]]; then
            HOST="${BASH_REMATCH[1]}"
            PORT="${BASH_REMATCH[2]}"
          fi
          : "${HOST:?SFTP_HOST resolves to an empty host}"
          if [[ ! "${HOST}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "SFTP_HOST could not be normalized to a valid hostname." >&2
            exit 1
          fi

          export SSHPASS="${SFTP_PASSWORD}"
          sshpass -e sftp \
            -b - \
            -oBatchMode=no \
            -oStrictHostKeyChecking=accept-new \
            -oConnectTimeout=20 \
            -P "${PORT}" \
            "${SFTP_USER}@${HOST}" <<SFTP
          -rm api.php
          -rm bootstrap.php
          -rm config.generated.php
          -rm index.php
          -rm .htaccess
          -rm assets/app.css
          -rm assets/app.js
          -rmdir assets
          cd ../../httpd.www
          -mkdir "${WEB_PATH}"
          cd "${WEB_PATH}"
          lcd public
          put -r *
          put .htaccess
          bye
          SFTP

      - name: Verify public page
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            --output /tmp/okonomi.html --write-out "%{http_code}" \
            "https://fundamentaleiendom.no/%C3%98konomi/")"
          echo "HTTP status: ${STATUS}"
          test "${STATUS}" = "200"
          grep -q "<title>Økonomi</title>" /tmp/okonomi.html
